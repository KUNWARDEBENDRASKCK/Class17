    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Flex Gallery</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f2f2f2;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}


.image-box{
    flex:1 1 22%;
    max-width:22%;
    overflow:hidden;
    border-radius:10px;
}

.image-box img{
    width:100%;
    height:100%;
    transition:0.4s;
}

.image-box img:hover{
    transform:scale(1.1);
}


@media(max-width:992px){
    .image-box{
        flex:1 1 30%;
        max-width:30%;
    }
}

@media(max-width:768px){
    .image-box{
        flex:1 1 45%;
        max-width:45%;
    }
}

@media(max-width:480px){
    .image-box{
        flex:1 1 100%;
        max-width:100%;
    }
}


/
</style>
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="gallery">

    <div class="image-box">
        <img src="https://picsum.photos/id/1011/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1015/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1016/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1020/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1024/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1027/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1035/400/300">
    </div>

    <div class="image-box">
        <img src="https://picsum.photos/id/1039/400/300">
    </div>

</div>

</body>
</html>

</body>
</html>
